[package]
name = "dse-data-fetcher"
version = "2.0.0-beta.3"
description = "DSE Data Fetcher"
authors = ["Shadman Rafid Chowdhury (codesfromshad)"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "dse_data_fetcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Self-update from GitHub Releases (signed NSIS installers + latest.json).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Replaces curl.exe. Default TLS = SChannel on Windows, same as curl.exe used.
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
# Company-page parsing (was cheerio) and the workbook (was ExcelJS).
scraper = { version = "0.29", default-features = false }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = "0.101"

[target.'cfg(windows)'.dependencies]
# AssocQueryStringW: which app opens .xlsx files.
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# The pipeline tests run against a tiny local HTTP server.
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
